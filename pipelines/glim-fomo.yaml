# -----------------------------------------------------------------------------
# GLIM algorithm parameters, for the FoMo dataset
# (RoboSense 128-channel LiDAR + VectorNav IMU, off-road vehicle, boreal forest).
#
# Starting point is glim-oxford-spires.yaml with the extrinsics and the
# near-field cut replaced. No FoMo-specific retuning has been done,
# deliberately: the first number this file produces is the like-for-like
# cross-method reference against the Fast-LIO2 and DLIO wrappers' fomo
# pipelines, which are in the same unretuned state.
#
# Only GLIM's odometry stage runs (no sub-mapping / global mapping), so these
# numbers stay comparable with the other LiDAR-inertial ODOMETRY wrappers.
# -----------------------------------------------------------------------------

# T_lidar_imu: pose of the VectorNav IMU wrt the RoboSense LiDAR, GLIM's own
# `T_lidar_imu` convention, uninverted. Composed from the dataset's own
# calib/transforms.json (robosense -> zedx_left -> vectornav), identical on all
# twelve deployments; the IMU z axis lands 0.3 deg from the LiDAR z axis.
imu_pose_in_lidar: "0.823235 -0.105926 -0.375205 89.824523 0.161172 -0.186357"

# The LiDAR is the base frame in this dataset's evaluation (same as the
# mola_lidar_odometry profile), so no base offset.
baselink2lidar_pose_str: "0 0 0 0 0 0"

lidar_sensor_label: "lidar"
imu_sensor_label: "imu"

# Fallback only: the converted clouds carry real per-point timestamps.
fallback_scan_period: 0.1

blind: 0.0

glim_config_path: ${GLIM_CONFIG_PATH|''}
log_level: ${GLIM_LOG_LEVEL|error}

# --- IMU noise (generic MEMS-grade values, as in the sibling pipelines) ---
imu_acc_noise:  ${GLIM_ACC_NOISE|0.05}
imu_gyro_noise: ${GLIM_GYRO_NOISE|0.02}
imu_int_noise:  ${GLIM_INT_NOISE|0.001}
imu_bias_noise: ${GLIM_BIAS_NOISE|1e-5}

# --- Preprocessing ---
# A vehicle body sits around the sensor; 1.0 m matches the minimum range the
# mola_lidar_odometry pipeline applies on this dataset.
distance_near_thresh: ${GLIM_NEAR_THRESH|1.0}
distance_far_thresh:  ${GLIM_FAR_THRESH|150.0}
use_random_grid_downsampling: ${GLIM_RANDOM_DOWNSAMPLE|true}
downsample_resolution: ${GLIM_DOWNSAMPLE_RES|1.0}
downsample_target:     ${GLIM_DOWNSAMPLE_TARGET|10000}
downsample_rate:       ${GLIM_DOWNSAMPLE_RATE|0.1}
enable_outlier_removal: false
k_correspondences:     ${GLIM_K_CORRESPONDENCES|10}

# --- Registration ---
registration_type: ${GLIM_REGISTRATION|GICP}
max_iterations:    ${GLIM_MAX_ITERATIONS|8}
lru_thresh:        100
target_downsampling_rate: ${GLIM_TARGET_DOWNSAMPLE_RATE|0.1}
ivox_resolution:   ${GLIM_IVOX_RESOLUTION|0.5}
ivox_min_dist:     ${GLIM_IVOX_MIN_DIST|0.1}
vgicp_resolution:  ${GLIM_VGICP_RESOLUTION|0.5}
vgicp_voxelmap_levels: ${GLIM_VGICP_LEVELS|1}
vgicp_voxelmap_scaling_factor: 2.0

# --- Estimator ---
initialization_mode: ${GLIM_INIT_MODE|LOOSE}
initialization_window_size: ${GLIM_INIT_WINDOW|3.0}
smoother_lag:        ${GLIM_SMOOTHER_LAG|5.0}
fix_imu_bias:        false
validate_imu:        true
save_imu_rate_trajectory: false
num_threads:         ${GLIM_NUM_THREADS|4}

# --- Estimated trajectory output ---
save_trajectory_to_file: ${MOLA_SAVE_TRAJECTORY|false}
trajectory_output_file: ${MOLA_TUM_TRAJECTORY_OUTPUT|'estimated_trajectory.tum'}
